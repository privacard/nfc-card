<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Privacard</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#090909;
color:white;
}

.page{
max-width:520px;
margin:auto;
padding-bottom:50px;
}

/* HERO */

.hero{
height:420px;
position:relative;
background-size:cover;
background-position:center;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
to bottom,
transparent 20%,
rgba(0,0,0,.85)
);
}

.hero-content{
position:absolute;
z-index:2;
left:28px;
bottom:35px;
}

.label{
font-size:11px;
letter-spacing:4px;
margin-bottom:10px;
}

.hero h1{
font-family:Georgia,serif;
font-size:43px;
font-weight:400;
line-height:.95;
}

.subtitle{
margin-top:15px;
font-size:13px;
letter-spacing:2px;
}

/* CONTENT */

.content{
padding:0 20px;
}

.section{
margin-top:18px;
padding:22px;
border:1px solid #292929;
background:#111;
}

.section-title{
font-size:10px;
letter-spacing:3px;
color:#888;
margin-bottom:16px;
}

/* BUTTONS */

.button{
display:flex;
align-items:center;
justify-content:space-between;

width:100%;
min-height:53px;

padding:0 17px;
margin-top:9px;

text-decoration:none;

font-size:13px;

border-radius:2px;
}

.instagram{
background:#eee;
color:#111;
}

.google{
background:#191919;
border:1px solid #333;
color:white;
}

/* CATALOG */

.catalog{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.hair-card{
background:#171717;
border:1px solid #292929;
overflow:hidden;
}

.hair-card img{
width:100%;
height:140px;
object-fit:cover;
display:block;
}

.hair-info{
padding:12px;
}

.hair-name{
font-size:12px;
font-weight:bold;
}

.hair-desc{
margin-top:5px;
font-size:10px;
color:#777;
line-height:1.5;
}

/* STYLE FINDER */

textarea{
width:100%;
height:100px;

background:#171717;
border:1px solid #333;

color:white;

padding:13px;

resize:none;
outline:none;
}

.find-button{
width:100%;
height:50px;

margin-top:9px;

border:none;

font-weight:bold;
letter-spacing:1px;

cursor:pointer;
}

.recommendation{
display:none;

margin-top:12px;

padding:14px;

background:#181818;

font-size:12px;

line-height:1.6;
}

/* IBAN */

.iban-box{
background:#171717;
border:1px solid #292929;
padding:16px;
margin-bottom:9px;
}

.iban-label{
font-size:10px;
letter-spacing:2px;
color:#777;
display:block;
margin-bottom:8px;
}

.iban{
font-size:13px;
word-break:break-word;
}

.copy-button{
width:100%;
height:52px;
border:none;
font-weight:bold;
cursor:pointer;
}

.message{
text-align:center;
min-height:18px;
margin-top:9px;
font-size:12px;
}

/* BANK */

.bank-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.bank{
height:46px;

background:#151515;

border:1px solid #292929;

color:white;

cursor:pointer;
}

/* FOOTER */

.footer{
text-align:center;

margin-top:30px;

font-size:9px;

letter-spacing:3px;

color:#555;
}

</style>

</head>


<body>


<div class="page">


<section
class="hero"
id="hero">

<div class="hero-content">

<div
class="label"
id="label">
HAIR DESIGNER
</div>

<h1 id="name">
Privacard
</h1>

<div
class="subtitle"
id="subtitle">
CUT · STYLE · DETAIL
</div>

</div>

</section>


<div class="content">


<!-- ABOUT -->

<section class="section">

<div class="section-title">
ABOUT
</div>

<p id="about"
style="color:#aaa;font-size:14px;line-height:1.7;">
Hoş geldiniz.
</p>

</section>


<!-- SOCIAL -->

<section class="section">

<div class="section-title">
CONNECT
</div>

<a
id="instagram"
class="button instagram"
target="_blank">

<span>Instagram</span>
<span>↗</span>

</a>


<a
id="google"
class="button google"
target="_blank">

<span>⭐ Google'da Yorum Yap</span>
<span>↗</span>

</a>

</section>


<!-- CATALOG -->

<section class="section">

<div class="section-title">
HAIR CATALOG
</div>

<div
class="catalog"
id="catalog">
</div>

</section>


<!-- STYLE FINDER -->

<section class="section">

<div class="section-title">
FIND YOUR STYLE
</div>

<p
style="font-size:13px;color:#aaa;line-height:1.6;margin-bottom:14px;">

Saçını ve istediğin tarzı anlat.
Sana uygun bir stil önerelim.

</p>


<textarea
id="styleInput"
placeholder="Örn: Saçım düz, yüzüm uzun, yanları çok kısa istemiyorum...">
</textarea>


<button
id="findButton"
class="find-button"
onclick="recommendStyle()">

STİLİMİ BUL

</button>


<div
id="recommendation"
class="recommendation">
</div>

</section>


<!-- PAYMENT -->

<section class="section">

<div class="section-title">
PAYMENT
</div>


<div class="iban-box">

<span class="iban-label">
IBAN
</span>

<div
id="iban"
class="iban">
</div>

</div>


<button
id="copyButton"
class="copy-button"
onclick="copyIBAN()">

IBAN'I KOPYALA

</button>


<div
id="message"
class="message">
</div>


<div
class="section-title"
style="margin-top:23px;">

BANKANI SEÇ

</div>


<div class="bank-grid">

<button class="bank">
Garanti BBVA
</button>

<button class="bank">
Akbank
</button>

<button class="bank">
İş Bankası
</button>

<button class="bank">
Yapı Kredi
</button>

<button class="bank">
Ziraat
</button>

<button class="bank">
VakıfBank
</button>

</div>

</section>


<div class="footer">

PRIVACARD · DIGITAL IDENTITY

</div>


</div>

</div>


<script>


/* =================================
   MÜŞTERİ VERİLERİ
================================= */


const customers = {


birkan: {

name:"Birkan Igan",

label:"HAIR DESIGNER",

subtitle:"CUT · STYLE · DETAIL",

about:
"Modern saç tasarımı, kişisel stil ve detay odaklı grooming deneyimi.",

instagram:
"https://instagram.com/birkanigan",

google:
"https://www.google.com/search?q=Birkan+Igan",

iban:
"TR12 3456 7890 1234 5678 9012 34",

color:"#c9a86a",

background:
"https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1000&q=85",

catalog:[

["TEXTURED CROP",
"Modern · doğal doku",
"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=600&q=80"],

["MODERN MULLET",
"Karakterli · hacimli",
"https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=600&q=80"],

["LOW TAPER",
"Temiz · minimal",
"https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=600&q=80"],

["SLICK BACK",
"Modern klasik",
"https://images.unsplash.com/photo-1593702295094-aea52b6f3c7b?auto=format&fit=crop&w=600&q=80"]

]

},



mehmet: {

name:"Mehmet Barber",

label:"BARBER STUDIO",

subtitle:"CRAFT · STYLE · DETAIL",

about:
"Modern erkek saç tasarımı, kesim ve kişisel stil.",

instagram:
"https://instagram.com/mehmetbarber",

google:
"https://www.google.com/search?q=Mehmet+Barber",

iban:
"TR98 7654 3210 9876 5432 1098 76",

color:"#b83a3a",

background:
"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1000&q=85",

catalog:[

["TEXTURED CROP",
"Doğal · modern",
"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=600&q=80"],

["BURST FADE",
"Keskin · karakterli",
"https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=600&q=80"],

["LOW FADE",
"Temiz · modern",
"https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=600&q=80"],

["MESSY STYLE",
"Rahat · doğal",
"https://images.unsplash.com/photo-1593702295094-aea52b6f3c7b?auto=format&fit=crop&w=600&q=80"]

]

},



ahmet: {

name:"Ahmet Barber",

label:"MODERN BARBER",

subtitle:"CUT · FORM · STYLE",

about:
"Minimal, modern ve kişiye özel erkek saç tasarımı.",

instagram:
"https://instagram.com/ahmetbarber",

google:
"https://www.google.com/search?q=Ahmet+Barber",

iban:
"TR45 1111 2222 3333 4444 5555 66",

color:"#8d9a91",

background:
"https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1000&q=85",

catalog:[

["FLOW",
"Doğal · hacimli",
"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=600&q=80"],

["TEXTURED CROP",
"Modern · rahat",
"https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=600&q=80"],

["TAPER",
"Minimal · temiz",
"https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=600&q=80"],

["SLICK BACK",
"Şık · güçlü",
"https://images.unsplash.com/photo-1593702295094-aea52b6f3c7b?auto=format&fit=crop&w=600&q=80"]

]

}

};


/* =================================
   URL'DEN MÜŞTERİYİ BUL
================================= */


const params =
new URLSearchParams(window.location.search);

const customerID =
params.get("customer") || "birkan";


const customer =
customers[customerID] || customers.birkan;


/* =================================
   SAYFAYI DOLDUR
================================= */


document.title =
customer.name + " — Privacard";


document.getElementById("name")
.innerText =
customer.name;


document.getElementById("label")
.innerText =
customer.label;


document.getElementById("subtitle")
.innerText =
customer.subtitle;


document.getElementById("about")
.innerText =
customer.about;


document.getElementById("instagram")
.href =
customer.instagram;


document.getElementById("google")
.href =
customer.google;


document.getElementById("iban")
.innerText =
customer.iban;


document.getElementById("hero")
.style.backgroundImage =

`url("${customer.background}")`;


document.getElementById("copyButton")
.style.background =
customer.color;


document.getElementById("findButton")
.style.background =
customer.color;


/* CATALOG */


const catalog =
document.getElementById("catalog");


customer.catalog.forEach(item => {

catalog.innerHTML += `

<div class="hair-card">

<img src="${item[2]}">

<div class="hair-info">

<div class="hair-name">
${item[0]}
</div>

<div class="hair-desc">
${item[1]}
</div>

</div>

</div>

`;

});


/* =================================
   IBAN KOPYALA
================================= */


function copyIBAN(){

navigator.clipboard.writeText(
customer.iban
);

document.getElementById("message")
.innerText =
"✓ IBAN kopyalandı";

}


/* =================================
   BASİT STİL ÖNERİCİ
================================= */


function recommendStyle(){

const text =
document
.getElementById("styleInput")
.value
.toLowerCase();


let result;


if(
text.includes("uzun")
){

result =
"<strong>ÖNERİ: TEXTURED CROP + LOW TAPER</strong><br><br>"+
"Yüz oranlarını daha dengeli göstermek için üstte kontrollü doku ve yanlarda düşük geçiş düşünülebilir.";

}

else if(
text.includes("kıvırcık") ||
text.includes("dalgalı")
){

result =
"<strong>ÖNERİ: CURLY TOP + TAPER</strong><br><br>"+
"Doğal saç dokusunu koruyup yanları kontrollü temizlemek modern ve karakterli bir görünüm sağlayabilir.";

}

else{

result =
"<strong>ÖNERİ: LOW TAPER + TEXTURED TOP</strong><br><br>"+
"Modern, temiz ve farklı yüz şekillerine uyarlanabilecek güçlü bir başlangıç.";

}


const box =
document.getElementById("recommendation");

box.innerHTML =
result;

box.style.display =
"block";

}

</script>


</body>

</html>
