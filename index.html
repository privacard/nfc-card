<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BİRKAN IGAN — Hair Designer</title>

<meta name="description"
content="Birkan Igan — Hair Designer. Randevu, Instagram, Google yorumları ve ödeme.">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0a0a0a;
    color: #f4f1ea;
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding-bottom: 45px;
}

/* HERO */

.hero {
    height: 430px;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.55),
            #0a0a0a
        ),
        url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1000&q=85");

    background-size: cover;
    background-position: center;
}

.hero-content {
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 35px;
}

.small-title {
    font-size: 11px;
    letter-spacing: 4px;
    color: #c9a86a;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.hero h1 {
    font-family: Georgia, serif;
    font-size: 42px;
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -1px;
}

.hero h1 span {
    color: #c9a86a;
}

.hero-subtitle {
    margin-top: 15px;
    color: #c8c5bd;
    font-size: 14px;
    letter-spacing: 1px;
}

/* CONTENT */

.content {
    padding: 0 20px;
}

.section {
    margin-top: 18px;
    padding: 22px;
    border: 1px solid #242424;
    background: #101010;
    border-radius: 2px;
}

.section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8f8a80;
    margin-bottom: 16px;
}

/* INTRO */

.intro {
    line-height: 1.7;
    color: #bcb9b2;
    font-size: 14px;
}

.intro strong {
    color: #f4f1ea;
    font-weight: 500;
}

/* BUTTONS */

.button {
    display: flex;
    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 55px;

    padding: 0 18px;
    margin-top: 10px;

    border-radius: 2px;
    text-decoration: none;

    font-size: 13px;
    letter-spacing: 0.5px;

    transition: 0.2s;
}

.button:hover {
    transform: translateY(-2px);
}

.instagram {
    background: #f0ede6;
    color: #111;
}

.google {
    background: #191919;
    border: 1px solid #303030;
    color: #eee;
}

.arrow {
    font-size: 18px;
}

/* IBAN */

.iban-box {
    background: #171717;
    border: 1px solid #292929;
    padding: 17px;
    margin-bottom: 10px;
}

.iban-label {
    display: block;
    color: #77736c;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.iban {
    font-size: 14px;
    letter-spacing: 0.5px;
    word-break: break-word;
    color: #e8e3d9;
}

.copy-button {
    width: 100%;
    min-height: 52px;

    border: none;
    border-radius: 2px;

    background: #c9a86a;
    color: #0c0c0c;

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;

    cursor: pointer;
}

.copy-button:active {
    transform: scale(0.98);
}

.message {
    text-align: center;
    min-height: 18px;
    margin-top: 10px;

    font-size: 12px;
    color: #c9a86a;
}

/* BANKS */

.bank-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.bank {
    min-height: 48px;

    background: #151515;
    border: 1px solid #292929;
    color: #ddd;

    border-radius: 2px;

    font-size: 12px;
    cursor: pointer;
}

.bank:hover {
    border-color: #c9a86a;
    color: #c9a86a;
}

/* FOOTER */

.footer {
    text-align: center;
    padding: 30px 20px 0;

    color: #55514b;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

@media(max-width: 380px) {

    .hero {
        height: 390px;
    }

    .hero h1 {
        font-size: 36px;
    }

}

</style>
</head>


<body>

<div class="page">

    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <div class="small-title">
                Hair Designer
            </div>

            <h1>
                Birkan<br>
                <span>Igan</span>
            </h1>

            <p class="hero-subtitle">
                CUT · STYLE · DETAIL
            </p>

        </div>

    </section>


    <div class="content">


        <!-- ABOUT -->

        <section class="section">

            <div class="section-label">
                About
            </div>

            <p class="intro">

                <strong>Birkan Igan</strong> — kişisel stil,
                modern saç tasarımı ve detay odaklı
                grooming deneyimi.

            </p>

        </section>


        <!-- SOCIAL -->

        <section class="section">

            <div class="section-label">
                Connect
            </div>


            <a
                href="https://instagram.com/birkanigan"
                target="_blank"
                class="button instagram"
            >

                <span>Instagram</span>

                <span class="arrow">↗</span>

            </a>


            <a
                href="https://www.google.com/search?q=Birkan+Igan+Hair+Designer"
                target="_blank"
                class="button google"
            >

                <span>Google'da Yorum Yap</span>

                <span class="arrow">↗</span>

            </a>

        </section>


        <!-- PAYMENT -->

        <section class="section">

            <div class="section-label">
                Payment
            </div>


            <div class="iban-box">

                <span class="iban-label">
                    IBAN
                </span>

                <div
                    class="iban"
                    id="iban"
                >
                    TR12 3456 7890 1234 5678 9012 34
                </div>

            </div>


            <button
                class="copy-button"
                onclick="copyIBAN()"
            >
                IBAN'I KOPYALA
            </button>


            <div
                class="message"
                id="message"
            ></div>


            <div class="section-label"
                 style="margin-top:24px;">

                Bankanı Seç

            </div>


            <div class="bank-grid">

                <button
                    class="bank"
                    onclick="openBank('Garanti BBVA')"
                >
                    Garanti BBVA
                </button>

                <button
                    class="bank"
                    onclick="openBank('Akbank')"
                >
                    Akbank
                </button>

                <button
                    class="bank"
                    onclick="openBank('İş Bankası')"
                >
                    İş Bankası
                </button>

                <button
                    class="bank"
                    onclick="openBank('Yapı Kredi')"
                >
                    Yapı Kredi
                </button>

                <button
                    class="bank"
                    onclick="openBank('Ziraat Bankası')"
                >
                    Ziraat
                </button>

                <button
                    class="bank"
                    onclick="openBank('VakıfBank')"
                >
                    VakıfBank
                </button>

                <button
                    class="bank"
                    onclick="openBank('Halkbank')"
                >
                    Halkbank
                </button>

                <button
                    class="bank"
                    onclick="openBank('QNB')"
                >
                    QNB
                </button>

            </div>

        </section>


        <div class="footer">
            PRIVACARD · DIGITAL IDENTITY
        </div>

    </div>

</div>


<script>

const IBAN =
"TR123456789012345678901234";


function copyIBAN() {

    navigator.clipboard.writeText(IBAN);

    const message =
        document.getElementById("message");

    message.innerText =
        "✓ IBAN kopyalandı";

    setTimeout(() => {

        message.innerText = "";

    }, 2500);

}


function openBank(bank) {

    navigator.clipboard.writeText(IBAN);

    const message =
        document.getElementById("message");

    message.innerText =
        "✓ IBAN kopyalandı — " + bank + " açılıyor";

    /*
        Bankaların resmi uygulama
        yönlendirmelerini daha sonra
        buraya bağlayacağız.
    */

}

</script>

</body>
</html>
